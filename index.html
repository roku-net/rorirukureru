    <style>
        body {

            padding: 0;
            font-family: 'Orbitron', sans-serif;
            color: #cdd3cd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-shadow: 0 0 5px #505050;

                repeating-linear-gradient(0deg,
                    rgba(0, 255, 0, 0.05),
                    rgba(0, 255, 0, 0.05) 2px,

            background-attachment: fixed;

        .contenedorPrincipal {
            background: #111;

        }

            font-size: 1.4rem;

            margin: 0;
            text-align: center;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }

        .links a {
            background-color: #111;
            border: 2px solid #072c00;
            padding: 10px 18px;
            color: #5ae3bc;
            text-decoration: none;
            transition: all 0.3s;
            text-align: center;
            font-size: 0.9rem;
            flex: 1 1 180px;
            max-width: 220px;
        }

        .links a:hover {
            background-color: #82d2be;
            color: #111;
            text-shadow: none;
        }



        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .rokuPerfil h1 {
                font-size: 1.2rem;
            }

            .rokuPerfil img {
                width: 140px;
                height: 140px;
            }

            .links {
                gap: 10px;
            }

            .links a {
                padding: 8px 10px;
                font-size: 0.8rem;
                flex: 1;
            }

            
        }
